[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smith-ai-mcp"
version = "0.1.0"
description = "MCP server for Smith.ai — outbound call requests, campaign management, and call record retrieval for law firms"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
    "structlog>=26,<27",
]

[project.scripts]
smith-ai-mcp = "smith_ai_mcp.server:main"
smith-ai-mcp-setup = "smith_ai_mcp.setup.setup:main"
smith-ai-mcp-verify = "smith_ai_mcp.setup.verify:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
